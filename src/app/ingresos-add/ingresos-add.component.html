<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cerrar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Registrar ingreso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ia-content">
  <div class="ia-form">

    <section class="ia-banner">
      <div class="ia-banner-icon">
        <ion-icon name="trending-up-outline"></ion-icon>
      </div>
      <div class="ia-banner-text">
        <h2>Nuevo ingreso</h2>
        <p>Registra el monto, categoría y forma de cobro.</p>
      </div>
    </section>

    <section class="ia-body">
      <div class="ia-field">
        <label>
          <ion-icon name="create-outline"></ion-icon>
          Descripción <span>*</span>
        </label>
        <ion-input
          [(ngModel)]="ingreso.descripcion"
          placeholder="Ej: Pago de arrendamiento">
        </ion-input>
      </div>

      <div class="ia-grid">
        <div class="ia-field">
          <label>
            <ion-icon name="pricetag-outline"></ion-icon>
            Categoría
          </label>
          <ion-select
            [(ngModel)]="ingreso.categoria"
            interface="popover"
            placeholder="Seleccione">
            <ion-select-option *ngFor="let c of categorias" [value]="c">
              {{ c }}
            </ion-select-option>
          </ion-select>
        </div>

        <div class="ia-field">
          <label>
            <ion-icon name="cash-outline"></ion-icon>
            Monto (RD$) <span>*</span>
          </label>
          <ion-input
            type="number"
            min="0"
            [(ngModel)]="ingreso.monto"
            placeholder="0.00">
          </ion-input>
        </div>
      </div>

      <div class="ia-field">
        <label>
          <ion-icon name="card-outline"></ion-icon>
          Forma de pago
        </label>
        <ion-select
          [(ngModel)]="ingreso.formaPago"
          interface="popover"
          placeholder="Seleccione">
          <ion-select-option
            *ngFor="let metodo of metodosPago"
            [value]="metodo.metodoPago">
            {{ metodo.metodoPago }}
          </ion-select-option>
        </ion-select>
      </div>

      <div class="ia-field">
        <label>
          <ion-icon name="receipt-outline"></ion-icon>
          Referencia / comprobante
        </label>
        <ion-input
          [(ngModel)]="ingreso.referencia"
          placeholder="Referencia interna (opcional)">
        </ion-input>
      </div>

      <div class="ia-field">
        <label>
          <ion-icon name="document-text-outline"></ion-icon>
          Nota (opcional)
        </label>
        <ion-textarea
          autoGrow="true"
          rows="3"
          [(ngModel)]="ingreso.nota"
          placeholder="Detalle adicional">
        </ion-textarea>
      </div>
    </section>

    <div class="ia-actions">
      <ion-button expand="block" fill="outline" color="medium" (click)="cerrar()">
        Cancelar
      </ion-button>
      <ion-button
        expand="block"
        color="warning"
        (click)="guardarIngreso()"
        [disabled]="cargando">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ cargando ? 'Guardando…' : 'Guardar' }}
      </ion-button>
    </div>
  </div>
</ion-content>
