<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEdit ? 'Editar proveedor' : 'Nuevo proveedor' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Nombre comercial *</ion-label>
    <ion-input [(ngModel)]="proveedor.nombreComercial"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">RNC</ion-label>
    <ion-input [(ngModel)]="proveedor.rnc"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Teléfono</ion-label>
    <ion-input [(ngModel)]="proveedor.telefono"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Email</ion-label>
    <ion-input type="email" [(ngModel)]="proveedor.email"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Dirección</ion-label>
    <ion-textarea [(ngModel)]="proveedor.direccion"></ion-textarea>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Nota</ion-label>
    <ion-textarea [(ngModel)]="proveedor.nota"></ion-textarea>
  </ion-item>
  <ion-item *ngIf="isEdit">
    <ion-label>Activo</ion-label>
    <ion-toggle [(ngModel)]="proveedor.isActivo"></ion-toggle>
  </ion-item>

  <ion-button expand="block" color="primary" class="ion-margin-top" (click)="guardar()">
    Guardar
  </ion-button>
</ion-content>
