<ion-header>
  <ion-toolbar color="danger">
    <ion-title>
      Anular factura
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" [disabled]="procesando">
        <ion-icon
          slot="icon-only"
          name="close-outline">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>

    <ion-card-header>
      <ion-card-title>
        {{
          factura?.numeroDocumento
          || ('Fact-' + factura?.idFacturaHeader)
        }}
      </ion-card-title>
      <ion-card-subtitle>
        {{ factura?.nombreCuenta || 'Cliente' }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>
        Esta acción marcará la factura como anulada
        y revertirá los ingresos asociados.
        Indique el motivo para continuar.
      </p>
    </ion-card-content>

  </ion-card>

  <ion-item lines="full">
    <ion-label position="stacked">
      Motivo de anulación *
    </ion-label>
    <ion-textarea
      [(ngModel)]="motivo"
      rows="4"
      maxlength="500"
      placeholder="Ej: Error en el cobro, factura duplicada, cliente canceló...">
    </ion-textarea>
  </ion-item>

  <ion-button
    expand="block"
    color="danger"
    class="btn-confirmar"
    [disabled]="procesando || !motivo.trim()"
    (click)="confirmar()">

  <ion-spinner
    *ngIf="procesando"
    name="crescent">
  </ion-spinner>

  <span *ngIf="!procesando">
    Confirmar anulación
  </span>

  </ion-button>

</ion-content>
