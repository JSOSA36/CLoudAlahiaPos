<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Restablecer contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Nueva contraseña</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">Nueva contraseña</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="password">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Confirmar contraseña</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="confirmPassword">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        color="success"
        (click)="cambiarPassword()"
        [disabled]="loading">

        <ion-spinner *ngIf="loading" slot="start"></ion-spinner>
        Cambiar contraseña
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
