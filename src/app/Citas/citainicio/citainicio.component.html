<!-- Solo mostramos vista cuando empresa + colores cargados -->
<ng-container *ngIf="!cargando; else loadingTpl">

  <ion-header>
    <ion-toolbar style="height: 180px; box-shadow: none; background: var(--ion-color-primary);">
      <ion-title class="ion-text-center" style="margin-top: 20px; color: #000 !important;">
        <ion-avatar style="width: 150px; height: 150px; margin: auto; border: 4px solid white; background: #fff;">
          <ion-img [src]="empresa?.logo || logoDefault"></ion-img>
        </ion-avatar>
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding" color="light">
    <!-- Info del salón -->
    <div class="ion-text-center salon-info">
      <h2 style="color: #000; font-weight: bold; margin-bottom: 10px;">
        {{ empresa?.nombreComercial || 'Cargando...' }}
      </h2>
      <p *ngIf="empresa?.telefono" style="color: #000;">
        <ion-icon name="call-outline"></ion-icon>
        {{ empresa?.telefono }}
      </p>
     <div *ngIf="empresa?.direccion" 
     style="text-align:center; margin-top:5px;">

  <!-- Dirección -->
  <div style="display:flex; justify-content:center; align-items:center; gap:6px; color:#000;">
    <ion-icon name="location-outline"></ion-icon>
    <span>{{ empresa?.direccion }}</span>
  </div>

  <!-- Ver mapa estilo link -->
  <div (click)="abrirMapa()"
       style="display:flex;
              justify-content:center;
              align-items:center;
              gap:6px;
              margin-top:6px;
              color: var(--ion-color-primary);
              font-weight:500;
              cursor:pointer;
              text-decoration:underline;">
              
    <ion-icon name="map-outline"></ion-icon>
    <span>Ver mapa</span>
  </div>

</div>


    </div>

    <!-- Bienvenida -->
    <div class="ion-text-center bienvenida" style="margin-top: 20px;">
      <h3 style="color: #000;">¡Bienvenido a {{ empresa?.nombreComercial || '...' }}!</h3>
      <p style="color: #000; opacity: 0.7;">Reserva tu cita de forma rápida y sencilla</p>
    </div>

    <!-- Botón principal -->
    <ion-button expand="block" shape="round" size="large" fill="solid"
                style="--background: var(--ion-color-primary); --color: var(--ion-title-color); margin-top: 25px;"
                (click)="abrirCitaNueva()">
      <ion-icon name="calendar-outline" slot="start"></ion-icon>
      AGENDAR CITA
    </ion-button>

    <!-- Botón ver servicios -->
    <ion-button expand="block" shape="round" size="large" fill="solid"
                style="--background: var(--ion-color-primary); --color: var(--ion-title-color); margin-top: 15px;"
                (click)="VerCatalogo()">
      <ion-icon name="list-outline" slot="start"></ion-icon>
      Ver nuestros servicios
    </ion-button>

    <!-- Información para agendar -->
<div *ngIf="empresa?.infoAgendar" 
     style="margin-top:30px; padding:20px; border-radius:15px; background:#fff; box-shadow:0 4px 10px rgba(0,0,0,0.05);">

  <h3 style="text-align:center; font-weight:bold; margin-bottom:15px;">
    Información para agendar
  </h3>

  <div [innerHTML]="empresa?.infoAgendar"></div>

</div>

  </ion-content>
</ng-container>

<!-- Loader -->
<ng-template #loadingTpl>
  <ion-content class="ion-text-center ion-padding" fullscreen>
    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%;">
      <ion-spinner name="crescent"></ion-spinner>
      <p style="margin-top:12px;">Cargando empresa...</p>
    </div>
  </ion-content>
</ng-template>
