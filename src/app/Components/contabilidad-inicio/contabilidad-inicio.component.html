<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button style="color: white;"></ion-menu-button>
    </ion-buttons>
    <ion-title>Contabilidad</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let op of opciones">
        <ion-card class="opcion-card" button (click)="ir(op.ruta)">
          <ion-card-content>
            <div class="opcion-icon">
              <ion-icon [name]="op.icono"></ion-icon>
            </div>
            <h2>{{ op.titulo }}</h2>
            <p>{{ op.descripcion }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
