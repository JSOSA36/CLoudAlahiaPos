<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button style="color: white;"></ion-menu-button>
    </ion-buttons>

    <ion-title>Almacenes</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openModal()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card
    *ngFor="let almacen of almacenes"
    class="almacen-card">

    <ion-card-content>
      <ion-item lines="none">
        <ion-label>
          <h2>{{ almacen.nombre }}</h2>
          <p *ngIf="almacen.descripcion">{{ almacen.descripcion }}</p>
          <p *ngIf="almacen.esPrincipal" class="badge-principal">
            Principal
          </p>
          <p *ngIf="!almacen.activo" class="badge-inactivo">
            Inactivo
          </p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-button
            fill="clear"
            color="primary"
            (click)="openModal(almacen)">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>

          <ion-button
            fill="clear"
            color="danger"
            (click)="deleteAlmacen(almacen.idAlmacen)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-text *ngIf="almacenes.length === 0" color="medium">
    <p class="ion-text-center">No hay almacenes registrados.</p>
  </ion-text>
</ion-content>

<ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>
          {{ editingAlmacen ? 'Editar almacén' : 'Nuevo almacén' }}
        </ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeModal()">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-card class="form-card">
        <ion-card-content>
          <ion-item>
            <ion-label position="stacked">Nombre</ion-label>
            <ion-input
              [(ngModel)]="form.nombre"
              placeholder="Ej: Almacén principal">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Descripción</ion-label>
            <ion-textarea
              [(ngModel)]="form.descripcion"
              placeholder="Descripción opcional"
              rows="3">
            </ion-textarea>
          </ion-item>

          <ion-item>
            <ion-label>Principal</ion-label>
            <ion-toggle [(ngModel)]="form.esPrincipal"></ion-toggle>
          </ion-item>

          <ion-item *ngIf="editingAlmacen">
            <ion-label>Activo</ion-label>
            <ion-toggle [(ngModel)]="form.activo"></ion-toggle>
          </ion-item>

          <ion-button
            expand="block"
            color="primary"
            class="btn-guardar"
            (click)="saveAlmacen()">
            <ion-icon name="save-outline" slot="start"></ion-icon>
            {{ editingAlmacen ? 'Actualizar' : 'Guardar' }}
          </ion-button>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </ng-template>
</ion-modal>
