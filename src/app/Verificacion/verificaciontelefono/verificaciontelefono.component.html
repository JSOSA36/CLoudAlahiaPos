<ion-header>
<ion-toolbar 
  [ngStyle]="{
    '--background': primaryColor || 'var(--ion-color-primary)',
    'color': contrastColor
  }">
  <ion-title class="ion-text-center" [style.color]="contrastColor">
    Verificación de Correo
  </ion-title>
</ion-toolbar>

</ion-header>

<ion-content class="ion-padding">

  <div class="ion-text-center ion-margin-bottom">
    <ion-icon 
      name="mail-outline" 
      style="font-size: 60px;" 
      [style.color]="primaryColor">
    </ion-icon>
    <h2 [style.color]="contrastColor">Ingresa tu correo</h2>
    <p [style.color]="contrastColor">Verificaremos  antes de continuar.</p>
  </div>

  <ion-item>
    <ion-label position="floating">TELEFONO</ion-label>
    <ion-input type="Teléfono"[(ngModel)]="telefono"></ion-input>
  </ion-item>

  <p *ngIf="error" style="color: red; font-size: 14px; margin-top: 5px;">
    {{ error }}
  </p>

  <ion-button 
    expand="block" 
    shape="round" 
    size="large" 
    style="margin-top: 20px;"
    [ngStyle]="{
      '--background': primaryColor,
      '--color': contrastColor
    }"
    (click)="continuar()">
    <ion-icon slot="start" name="arrow-forward-outline"></ion-icon>
    Continuar
  </ion-button>

</ion-content>
